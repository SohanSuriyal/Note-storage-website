<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"> 
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NoteStorage</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--text:#171717;--muted:#777;--line:#e5e5e7;--accent:#0071e3;--soft:#eef6ff;--shadow:0 12px 40px #0000000d}
[data-theme=dark]{--bg:#111113;--card:#1c1c1f;--text:#f5f5f7;--muted:#a1a1a6;--line:#303034;--soft:#17283a;--shadow:0 12px 40px #0008}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;background:var(--bg);color:var(--text);height:100vh}
button,input,select{font:inherit}button{cursor:pointer;border:0}.app{display:flex;height:100vh}.side{width:245px;border-right:1px solid var(--line);padding:26px 16px;display:flex;flex-direction:column;background:color-mix(in srgb,var(--card) 82%,transparent)}
.logo{font-size:21px;font-weight:750;padding:0 12px 28px;letter-spacing:-.5px}.logo span{color:var(--accent)}
.nav button{display:block;width:100%;text-align:left;background:transparent;color:var(--muted);padding:12px 14px;border-radius:12px;margin:3px 0;font-weight:600}.nav button.active,.nav button:hover{background:var(--soft);color:var(--text)}.bottom{margin-top:auto}.main{flex:1;overflow:auto;padding:34px 46px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px}.eyebrow{color:var(--muted);font-size:14px}.title{font-size:36px;letter-spacing:-1.4px;margin:5px 0 0}.actions{display:flex;gap:10px}.btn{padding:11px 16px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--text);font-weight:650}.primary{background:var(--accent);color:white;border-color:var(--accent)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}.subject{min-height:145px;display:flex;flex-direction:column;justify-content:space-between;transition:.18s}.subject:hover{transform:translateY(-2px)}.emoji{font-size:27px}.count{color:var(--muted);font-size:13px}.search{width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--text);outline:none;margin-bottom:22px}.row{display:flex;align-items:center;gap:10px}.topic{display:flex;align-items:center;justify-content:space-between;padding:17px 18px;margin:9px 0;border:1px solid var(--line);border-radius:15px;background:var(--card)}.topic:hover{background:var(--soft)}.note{display:flex;align-items:center;gap:15px}.fileicon{width:42px;height:42px;border-radius:11px;background:var(--soft);display:grid;place-items:center;font-size:20px}.drop{border:1.5px dashed #aaa;border-radius:20px;padding:55px 20px;text-align:center;background:var(--card);margin-bottom:20px}.drop.drag{border-color:var(--accent);background:var(--soft)}.drop h2{margin:8px 0}.muted{color:var(--muted)}.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:20px;z-index:5}.modal.show{display:flex}.modalbox{width:min(620px,100%);background:var(--card);border-radius:22px;padding:25px;box-shadow:0 30px 100px #0005}.field{margin:15px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.field input,.field select{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--bg);color:var(--text)}.viewer{height:calc(100vh - 140px);background:#222;border-radius:18px;overflow:hidden}.viewer iframe,.viewer img{width:100%;height:100%;border:0;object-fit:contain}.empty{text-align:center;padding:70px;color:var(--muted)}
.settings-layout{display:grid;grid-template-columns:190px minmax(0,1fr);gap:26px;max-width:1050px}
.settings-nav{display:flex;flex-direction:column;gap:4px}
.settings-nav button{background:transparent;color:var(--muted);text-align:left;padding:11px 13px;border-radius:10px;font-weight:600}
.settings-nav button.active,.settings-nav button:hover{background:var(--soft);color:var(--text)}
.settings-panel{display:none}
.settings-panel.active{display:block}
.setting-card{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:16px;overflow:hidden}
.setting-card h3{margin:0;padding:18px 20px 5px;font-size:18px}
.setting-card>p{margin:0;padding:0 20px 16px;color:var(--muted);font-size:13px}
.setting-row{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:16px 20px;border-top:1px solid var(--line)}
.setting-row strong{display:block;font-size:14px}.setting-row small{display:block;color:var(--muted);margin-top:4px}
.setting-select{min-width:150px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text)}
.switch{position:relative;width:46px;height:27px;flex:0 0 auto}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;border-radius:99px;background:#aaa;transition:.2s;cursor:pointer}
.slider:before{content:"";position:absolute;width:21px;height:21px;left:3px;top:3px;background:white;border-radius:50%;transition:.2s}
.switch input:checked+.slider{background:var(--accent)}
.switch input:checked+.slider:before{transform:translateX(19px)}
.segmented{display:flex;border:1px solid var(--line);border-radius:10px;padding:2px;background:var(--bg)}
.segmented button{background:transparent;color:var(--muted);padding:7px 11px;border-radius:8px;font-size:13px}
.segmented button.active{background:var(--card);color:var(--text);box-shadow:0 1px 4px #0002}
.storage-bar{height:9px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 20px 18px}
.storage-fill{height:100%;width:0;background:var(--accent);border-radius:99px}
.danger{color:#d92d20}.danger-btn{color:#d92d20!important;border-color:#f2c0bc!important}
.backup-actions{display:flex;gap:9px;flex-wrap:wrap}


body.compact .card{padding:15px;min-height:120px}
body.compact .topic{padding:11px 14px;margin:6px 0}
body.compact .setting-row{padding:12px 16px}
body.no-animations *{transition:none!important;animation:none!important}
[data-note-view="list"] .grid{grid-template-columns:1fr}
[data-note-view="list"] .subject{min-height:auto;flex-direction:row;align-items:center}

@media(max-width:800px){.side{width:75px}.logo{font-size:0}.logo span{font-size:21px}.nav button{font-size:0;text-align:center}.nav button:first-letter{font-size:18px}.main{padding:25px 18px}.title{font-size:29px}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
  <div class="logo">Note<span>Storage</span></div>
  <nav class="nav">
    <button class="active" data-page="dashboard">⌂ &nbsp; Dashboard</button>
    <button data-page="subjects">▦ &nbsp; Subjects</button>
    <button data-page="recent">◷ &nbsp; Recent</button>
    <button data-page="favorites">☆ &nbsp; Favorites</button>
    <button data-page="settings">⚙ &nbsp; Settings</button>
      </nav>
  <div class="bottom nav">
    <button id="theme" type="button" onclick="toggleTheme()">☾ &nbsp; Dark mode</button>
    
  </div>
</aside>
<main class="main" id="main"></main>
</div>

<div class="modal" id="modal">
 <div class="modalbox">
  <div class="top" style="margin-bottom:10px"><div><h2 style="margin:0">Add notes</h2><div class="muted" id="modalHint" style="margin-top:4px">Choose files and where to store them.</div></div><button class="btn" onclick="closeModal()">✕</button></div>
  <div id="drop" class="drop" style="padding:35px 15px">
    <div style="font-size:34px">↑</div><h2>Drop your notes here</h2><div class="muted">PDF or handwritten images</div>
    <button class="btn primary" style="margin-top:15px" onclick="fileInput.click()">Choose files</button>
    <input id="fileInput" type="file" accept=".pdf,image/*" multiple hidden>
  </div>
  <div id="fileList" class="muted"></div>
  <div class="field"><label>Subject</label><input id="subjectInput" placeholder="e.g. DBMS"></div>
  <div class="field"><label>Topic</label><input id="topicInput" placeholder="e.g. RAID"></div>
  <div id="saveError" style="display:none;margin:12px 0;padding:10px 12px;border-radius:10px;background:#fff1f1;color:#b42318;font-size:13px"></div>
  <div class="row" style="justify-content:flex-end"><button class="btn" id="cancelBtn" onclick="closeModal()">Cancel</button><button class="btn primary" id="saveBtn" onclick="saveNotes()">Add Notes</button></div>
 </div>
</div>

<script>
const DB='notestorage-db', STORE='notes';
let db, notes=[], selectedFiles=[];
const main=document.getElementById('main');

function openDB(){return new Promise((res,rej)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE,{keyPath:'id',autoIncrement:true});r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)})}
function tx(mode='readonly'){return db.transaction(STORE,mode).objectStore(STORE)}
function load(){return new Promise((res,rej)=>{let r=tx().getAll();r.onsuccess=()=>{notes=r.result;res()};r.onerror=()=>rej(r.error)})}
function put(n){return new Promise((res,rej)=>{let r=tx('readwrite').add(n);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function del(id){return new Promise((res,rej)=>{let r=tx('readwrite').delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function subjectNames(){return [...new Set(notes.map(n=>n.subject))].sort()}
function topics(s){return [...new Set(notes.filter(n=>n.subject===s).map(n=>n.topic))].sort()}
function getGreeting() {
    const hour = new Date().getHours();

    if (hour < 12) {
        return "Good morning";
    } else if (hour < 17) {
        return "Good afternoon";
    } else if (hour < 21) {
        return "Good evening";
    } else {
        return "Good night";
    }
}
function openModal(subject='',topic=''){
  document.getElementById('modal').classList.add('show');
  document.getElementById('fileInput').value='';
  selectedFiles=[];
  subject=subject?decodeURIComponent(subject):(getSetting('lastSubject','false')==='true'?getSetting('lastSubjectName',''):'');
  topic=topic?decodeURIComponent(topic):'';
  document.getElementById('subjectInput').value=subject;
  document.getElementById('topicInput').value=topic;
  document.getElementById('modalHint').textContent=subject?`Adding notes to ${subject}`:'Choose files and where to store them.';
  document.getElementById('saveError').style.display='none';
  document.getElementById('saveBtn').disabled=false;
  document.getElementById('saveBtn').textContent='Add Notes';
  renderFiles();
}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function renderFiles(){document.getElementById('fileList').innerHTML=selectedFiles.map(f=>`<div style="padding:5px 0">📄 ${esc(f.name)}</div>`).join('')}
document.getElementById('fileInput').onchange=e=>{selectedFiles=[...e.target.files];renderFiles()};
async function saveNotes(){
  const s=document.getElementById('subjectInput').value.trim();
  const t=document.getElementById('topicInput').value.trim();
  if(s) setSetting('lastSubjectName',s);
  const error=document.getElementById('saveError');
  const btn=document.getElementById('saveBtn');
  error.style.display='none';
  error.textContent='';
  if(!selectedFiles.length || !s || !t){
    error.textContent='Please choose at least one file and enter both a subject and topic.';
    error.style.display='block';
    return;
  }
  btn.disabled=true;
  btn.textContent='Saving…';
  try{
    if(!db || db.objectStoreNames.length===0) await openDB();
    const store=db.transaction(STORE,'readwrite').objectStore(STORE);
    await new Promise((resolve,reject)=>{
      let remaining=selectedFiles.length, failed=false;
      const transaction=store.transaction;
      transaction.oncomplete=()=>failed?reject(new Error('The browser could not save the notes.')):resolve();
      transaction.onerror=()=>reject(transaction.error||new Error('IndexedDB save failed.'));
      transaction.onabort=()=>reject(transaction.error||new Error('The save was aborted.'));
      selectedFiles.forEach(f=>{
        const req=store.add({
          name:f.name,subject:s,topic:t,type:f.type||'application/octet-stream',
          size:f.size||0,blob:new Blob([f],{type:f.type||'application/octet-stream'}),
          created:Date.now(),favorite:false
        });
        req.onerror=()=>{failed=true};
        remaining--;
      });
    });
    await load();
    closeModal();
    renderDashboard();
  }catch(err){
    console.error('NoteStorage save error:',err);
    error.textContent='Could not save the note. Try again. If this keeps happening, use NoteStorage from GitHub Pages instead of opening the HTML directly as a file.';
    error.style.display='block';
  }finally{
    btn.disabled=false;
    btn.textContent='Add Notes';
  }
}
function card(s){let ns=notes.filter(n=>n.subject===s);return `<div class="card subject" onclick="showSubject('${encodeURIComponent(s)}')"><div><div class="emoji">📚</div><h3>${esc(s)}</h3></div><div class="row" style="justify-content:space-between"><div class="count">${ns.length} note${ns.length!==1?'s':''} · ${topics(s).length} topics</div><button class="btn" onclick="event.stopPropagation();openModal('${encodeURIComponent(s)}')">＋ Add</button></div></div>`}
function renderDashboard(){main.innerHTML=`<div class="top"><div><div class="eyebrow">Your learning library</div><h1 class="title">Good evening</h1></div><div class="actions"><button class="btn" onclick="openModal()">＋ Add notes</button></div></div><input class="search" placeholder="⌕  Search your notes..." oninput="search(this.value)"><div class="top" style="margin-bottom:15px"><h2 style="margin:0">Subjects</h2><span class="muted">${notes.length} notes</span></div><div class="grid">${subjectNames().map(card).join('')||`<div class="empty" style="grid-column:1/-1">No notes yet. Add your first PDF or handwritten page.</div>`}</div>`}
function renderSubjects(){main.innerHTML=`<div class="top"><div><div class="eyebrow">Library</div><h1 class="title">Subjects</h1></div><button class="btn primary" onclick="openModal()">＋ Add notes</button></div><div class="grid">${subjectNames().map(card).join('')||'<div class="empty" style="grid-column:1/-1">No subjects yet.</div>'}</div>`}
function showSubject(s){s=decodeURIComponent(s);let ns=notes.filter(n=>n.subject===s);main.innerHTML=`<div class="top"><div><div class="eyebrow"><button class="btn" onclick="renderSubjects()">← Subjects</button></div><h1 class="title">${esc(s)}</h1></div><button class="btn primary" onclick="openModal('${encodeURIComponent(s)}')">＋ Add PDF / note</button></div><div class="muted" style="margin-bottom:15px">${ns.length} notes · ${topics(s).length} topics</div>${topics(s).map(t=>`<div class="topic"><div onclick="showTopic('${encodeURIComponent(s)}','${encodeURIComponent(t)}')" style="display:flex;align-items:center;gap:8px;flex:1;cursor:pointer">📁 &nbsp;<b>${esc(t)}</b><span class="muted">${notes.filter(n=>n.subject===s&&n.topic===t).length} notes ›</span></div><button class="btn" onclick="openModal('${encodeURIComponent(s)}','${encodeURIComponent(t)}')">＋ Add</button></div>`).join('')||`<div class="empty">This subject is empty.<br><button class="btn primary" style="margin-top:15px" onclick="openModal('${encodeURIComponent(s)}')">＋ Add your first note</button></div>`}`}
function showTopic(s,t){s=decodeURIComponent(s);t=decodeURIComponent(t);let ns=notes.filter(n=>n.subject===s&&n.topic===t);const sort=getSetting('sort','recent');ns.sort((a,b)=>sort==='name'?a.name.localeCompare(b.name):sort==='name-desc'?b.name.localeCompare(a.name):b.created-a.created);main.innerHTML=`<div class="top"><div><div class="eyebrow"><button class="btn" onclick="showSubject('${encodeURIComponent(s)}')">← ${esc(s)}</button></div><h1 class="title">${esc(t)}</h1></div></div><div class="note-list" data-note-view="${getSetting('view','grid')}">${ns.map(n=>`<div class="topic" style="cursor:default"><div class="note" onclick="view(${n.id})" style="cursor:pointer"><div class="fileicon">${n.type==='application/pdf'?'📄':'🖼️'}</div><div><b>${esc(n.name)}</b><div class="muted">${n.type==='application/pdf'?'PDF':'Handwritten image'} · ${new Date(n.created).toLocaleDateString()}</div></div></div><div class="row"><button class="btn" onclick="toggleFav(${n.id})">${n.favorite?'★':'☆'}</button><button class="btn" onclick="removeNote(${n.id})">Delete</button></div></div>`).join('')}</div>`}
function view(id){let n=notes.find(x=>x.id===id);if(!n)return;let url=URL.createObjectURL(n.blob);main.innerHTML=`<div class="top"><div><button class="btn" onclick="showTopic('${encodeURIComponent(n.subject)}','${encodeURIComponent(n.topic)}')">← Back</button><h1 class="title">${esc(n.name)}</h1></div><button class="btn" onclick="toggleFav(${id})">${n.favorite?'★ Favorite':'☆ Favorite'}</button></div><div class="viewer">${n.type==='application/pdf'?`<iframe src="${url}"></iframe>`:`<img src="${url}" alt="${esc(n.name)}">`}</div>`}
async function toggleFav(id){let n=notes.find(x=>x.id===id);n.favorite=!n.favorite;await new Promise((res,rej)=>{let r=tx('readwrite').put(n);r.onsuccess=res;r.onerror=()=>rej(r.error)});await load();renderDashboard()}
async function removeNote(id){
  if(getSetting('confirmDelete','true')==='true' && !confirm('Delete this note?')) return;
  await del(id);await load();renderDashboard();
}
function renderRecent(){let ns=[...notes].sort((a,b)=>b.created-a.created).slice(0,20);main.innerHTML=`<div class="top"><div><div class="eyebrow">Library</div><h1 class="title">Recent</h1></div></div>${ns.map(n=>`<div class="topic" onclick="view(${n.id})"><div class="note"><div class="fileicon">${n.type==='application/pdf'?'📄':'🖼️'}</div><div><b>${esc(n.name)}</b><div class="muted">${esc(n.subject)} · ${esc(n.topic)}</div></div></div><span class="muted">›</span></div>`).join('')||'<div class="empty">Nothing here yet.</div>'}`}
function renderFav(){let ns=notes.filter(n=>n.favorite);main.innerHTML=`<div class="top"><div><div class="eyebrow">Library</div><h1 class="title">Favorites</h1></div></div>${ns.map(n=>`<div class="topic" onclick="view(${n.id})"><div class="note"><div class="fileicon">${n.type==='application/pdf'?'📄':'🖼️'}</div><div><b>${esc(n.name)}</b><div class="muted">${esc(n.subject)} · ${esc(n.topic)}</div></div></div><span>★</span></div>`).join('')||'<div class="empty">No favorites yet.</div>'}`}
function formatBytes(bytes){
  if(!bytes) return '0 B';
  const units=['B','KB','MB','GB'];
  const i=Math.min(Math.floor(Math.log(bytes)/Math.log(1024)),units.length-1);
  return `${(bytes/Math.pow(1024,i)).toFixed(i?1:0)} ${units[i]}`;
}
function totalBytes(){return notes.reduce((sum,n)=>sum+(n.size||0),0)}
function getSetting(k,fallback){const v=localStorage.getItem('ns-'+k);return v===null?fallback:v}
function setSetting(k,v){localStorage.setItem('ns-'+k,String(v))}
function currentTheme(){
  const v=getSetting('theme','system');
  if(v==='dark'||v==='light') return v;
  return window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
}
function applyTheme(theme){
  if(theme!=='dark' && theme!=='light') theme='light';
  setSetting('theme',theme);
  document.documentElement.dataset.theme = theme==='dark' ? 'dark' : '';
  const btn=document.getElementById('theme');
  if(btn) btn.textContent=theme==='dark'?'☀  Light mode':'☾  Dark mode';
}
function toggleTheme(){
  const current=getSetting('theme','system');
  const next=current==='dark'?'light':'dark';
  applyTheme(next);
  const btn=document.getElementById('theme');
  if(btn) btn.textContent=next==='dark'?'☀  Light mode':'☾  Dark mode';
}
function applyCompact(){
  document.body.classList.toggle('compact',getSetting('compact','false')==='true');
}
function applyAnimations(){
  document.body.classList.toggle('no-animations',getSetting('animations','true')!=='true');
}
function toggleThemeLabel(){
  const btn=document.getElementById('theme');
  if(!btn) return;
  btn.textContent=currentTheme()==='dark'?'☀  Light mode':'☾  Dark mode';
}
function applyInitialSettings(){
  applyTheme(getSetting('theme','system')==='system'?currentTheme():getSetting('theme','system'));
  applyCompact();
  applyAnimations();
  const system=window.matchMedia('(prefers-color-scheme: dark)');
  system.addEventListener?.('change',()=>{
    if(getSetting('theme','system')==='system') applyTheme(currentTheme());
  });
}

function renderSettings(){
  const theme=getSetting('theme',localStorage.theme==='dark'?'dark':'light');
  const view=getSetting('view','grid');
  const sort=getSetting('sort','recent');
  const confirmDelete=getSetting('confirmDelete','true')==='true';
  const animations=getSetting('animations','true')==='true';
  const compact=getSetting('compact','false')==='true';
  const lastSubject=getSetting('lastSubject','false')==='true';
  const bytes=totalBytes();

  main.innerHTML=`
  <div class="top"><div><div class="eyebrow">Preferences</div><h1 class="title">Settings</h1></div></div>
  <div class="settings-layout">
    <div class="settings-nav">
      <button class="active" data-setting-tab="appearance">Appearance</button>
      <button data-setting-tab="notes">Notes</button>
      <button data-setting-tab="storage">Storage</button>
      <button data-setting-tab="organization">Organization</button>
      <button data-setting-tab="privacy">Privacy</button>
      <button data-setting-tab="data">Data</button>
    </div>
    <div>
      <section class="settings-panel active" id="setting-appearance">
        <div class="setting-card"><h3>Appearance</h3><p>Customize how NoteStorage looks and behaves.</p>
          <div class="setting-row"><div><strong>Theme</strong><small>Choose the interface theme.</small></div>
            <select class="setting-select" id="themeSelect">
              <option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option>
            </select>
          </div>
          <div class="setting-row"><div><strong>Compact mode</strong><small>Reduce spacing across the library.</small></div>
            <label class="switch"><input id="compactToggle" type="checkbox"><span class="slider"></span></label>
          </div>
          <div class="setting-row"><div><strong>Animations</strong><small>Enable subtle hover and transition effects.</small></div>
            <label class="switch"><input id="animationToggle" type="checkbox"><span class="slider"></span></label>
          </div>
        </div>
      </section>

      <section class="settings-panel" id="setting-notes">
        <div class="setting-card"><h3>Notes</h3><p>Choose how your notes should be displayed and sorted.</p>
          <div class="setting-row"><div><strong>Default view</strong><small>Grid or list for note libraries.</small></div>
            <div class="segmented"><button data-view="grid">Grid</button><button data-view="list">List</button></div>
          </div>
          <div class="setting-row"><div><strong>Default sort</strong><small>Used whenever a note list is opened.</small></div>
            <select class="setting-select" id="sortSelect">
              <option value="recent">Recently added</option>
              <option value="name">Name A–Z</option>
              <option value="name-desc">Name Z–A</option>
            </select>
          </div>
        </div>
      </section>

      <section class="settings-panel" id="setting-storage">

          <div class="setting-row"><div><strong>Notes stored</strong><small>${notes.length} note${notes.length===1?'':'s'}</small></div><strong>${formatBytes(bytes)}</strong></div>

        </div>
      </section>

      <section class="settings-panel" id="setting-organization">
        <div class="setting-card"><h3>Organization</h3><p>Control a few library behaviors.</p>
          <div class="setting-row"><div><strong>Remember last subject</strong><small>Use your previous subject when adding notes.</small></div>
            <label class="switch"><input id="lastSubjectToggle" type="checkbox"><span class="slider"></span></label>
          </div>
          <div class="setting-row"><div><strong>Confirm before deleting</strong><small>Ask for confirmation before deleting notes.</small></div>
            <label class="switch"><input id="confirmDeleteToggle" type="checkbox"><span class="slider"></span></label>

        </div>

      <section class="settings-panel" id="setting-privacy">
        <div class="setting-card"><h3>Privacy</h3><p>NoteStorage is designed to keep your files on your device.</p>
          <div class="setting-row"><div><strong>🔒 Local storage</strong><small>Your PDFs and handwritten images are kept in this browser using IndexedDB. They are not uploaded to a NoteStorage server.</small></div></div>
          <div class="setting-row"><div><strong>Offline friendly</strong><small>The core library can continue working without an internet connection once the app is loaded.</small></div></div>
        </div>
      </section>

      <section class="settings-panel" id="setting-data">
        <div class="setting-card"><h3>Data</h3><p>Permanent actions are kept separate from everyday settings.</p>
          <div class="setting-row"><div><strong class="danger">Delete everything</strong><small>Remove every subject, topic and file from this browser.</small></div><button class="btn danger-btn" onclick="deleteEverything()">Delete all notes</button></div>

      </section>

  </div>`;

  document.getElementById('themeSelect').value=theme;
  document.getElementById('compactToggle').checked=compact;
  document.getElementById('animationToggle').checked=animations;
  document.getElementById('lastSubjectToggle').checked=lastSubject;
  document.getElementById('confirmDeleteToggle').checked=confirmDelete;
  document.getElementById('sortSelect').value=sort;
  document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));

  document.querySelectorAll('[data-setting-tab]').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('[data-setting-tab]').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.settings-panel').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    document.getElementById('setting-'+b.dataset.settingTab).classList.add('active');
  });

  document.getElementById('themeSelect').onchange=e=>{setSetting('theme',e.target.value);applyTheme(e.target.value==='system'?currentTheme():e.target.value);toggleThemeLabel();};

  document.getElementById('animationToggle').onchange=e=>{setSetting('animations',e.target.checked);applyAnimations()};
  document.getElementById('lastSubjectToggle').onchange=e=>setSetting('lastSubject',e.target.checked);

  document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{
    setSetting('view',b.dataset.view);
    document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x.dataset.view===b.dataset.view));
    applyViewPreference();
  });
}

function applyViewPreference(){
  // The preference is consumed by note-list renderers.
  document.body.dataset.noteView=getSetting('view','grid');
}

async function exportBackup(){
  const payload={version:1,app:'NoteStorage',exportedAt:new Date().toISOString(),notes:[]};
  for(const n of notes){
    const buf=await n.blob.arrayBuffer();
    const bytes=new Uint8Array(buf);
    let binary='';
    const chunk=0x8000;
    for(let i=0;i<bytes.length;i+=chunk) binary+=String.fromCharCode(...bytes.subarray(i,i+chunk));
    payload.notes.push({...n,blob:btoa(binary)});
  }
  const blob=new Blob([JSON.stringify(payload)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`notestorage-backup-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

async function importBackup(file){
  if(!file)return;
  try{
    const payload=JSON.parse(await file.text());
    if(payload.app!=='NoteStorage'||!Array.isArray(payload.notes))throw new Error('Invalid backup');
    for(const n of payload.notes){
      const binary=atob(n.blob);
      const bytes=new Uint8Array(binary.length);
      for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
      const copy={...n};
      delete copy.id;
      copy.blob=new Blob([bytes],{type:n.type||'application/octet-stream'});
      await put(copy);
    }
    await load();
    renderSettings();
    alert(`Imported ${payload.notes.length} note${payload.notes.length===1?'':'s'} successfully.`);
  }catch(e){
    console.error(e);
    alert('That backup could not be imported.');
  }
}

async function deleteEverything(){
  if(getSetting('confirmDelete','true')==='true' &&
     !confirm('Delete ALL NoteStorage notes and files? This cannot be undone unless you have a backup.')) return;
  await new Promise((resolve,reject)=>{
    const r=tx('readwrite').clear();
    r.onsuccess=resolve;r.onerror=()=>reject(r.error);
  });
  await load();
  renderSettings();
}

if(localStorage.theme==='dark')document.documentElement.dataset.theme='dark';
(async()=>{await openDB();await load();applyInitialSettings();applyViewPreference();toggleThemeLabel();renderDashboard()})();
